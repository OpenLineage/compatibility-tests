name: Hive Dataproc

on:
  workflow_call:
    secrets:
      gcpKey:
        required: true
    inputs:
      component_release:
        description: "release of hive dataproc to use"
        type: string
      ol_release:
        description: "release tag of OpenLineage to use"
        type: string
      get-latest-snapshots:
        description: "Should the artifact be downloaded from maven repo or circleci"
        type: string
      update-baseline:
        description: "Store the validated events as the baseline the PR checks re-validate (release check only)"
        type: boolean
        default: false

jobs:
  run-hive-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: initialize tests
        id: init
        run: |
          scenarios=$(./scripts/get_valid_test_scenarios.sh "producer/hive_dataproc/scenarios/" ${{ inputs.component_release }} ${{ inputs.ol_release }} )
          [[ "$scenarios" == "" ]] || echo "scenarios=$scenarios" >> $GITHUB_OUTPUT
          echo "cluster_name=hive-dataproc-producer-test-$(echo '${{ inputs.component_release }}' | sed 's/\.//g')-$(echo '${{ inputs.ol_release }}' | sed 's/\.//g')-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          # the cluster settings per Hive release are in producer/hive_dataproc/runner/cluster.json
          jq -e --arg v '${{ inputs.component_release }}' 'has($v)' producer/hive_dataproc/runner/cluster.json > /dev/null \
            || { echo "hive version ${{ inputs.component_release }} not supported"; exit 1; }

      - name: GCP authorization
        id: gcp-auth
        if: ${{ steps.init.outputs.scenarios }}
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      - name: Get OL artifacts
        id: get-ol-artifacts
        if: ${{ steps.init.outputs.scenarios }}
        uses: ./.github/actions/get_openlineage_artifacts
        with:
          version: ${{ inputs.ol_release }}
          get-latest-snapshots: ${{ inputs.get-latest-snapshots }}
          skip-java: 'true'
          skip-spark: 'true'
          skip-flink: 'true'
          skip-s3: 'true'
          skip-gcp-lineage: 'true'
          skip-sql: 'true'
          skip-gcs: 'true'  # see GCS_TRANSPORT_JAR below

      - name: Upload openlineage hive integration to GCS
        id: upload-hive-integration
        if: ${{ steps.init.outputs.scenarios }}
        uses: ./.github/actions/upload_artifacts
        with:
          local-file-path: ${{ steps.get-ol-artifacts.outputs.hive }}
          gcs-path: "gs://open-lineage-e2e/jars"
          credentials: ${{ steps.gcp-auth.outputs.credentials_file_path }}

      - name: Set up Python 3.11
        if: ${{ steps.init.outputs.scenarios }}
        uses: actions/setup-python@v5
        with:
          cache: "pip"
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.init.outputs.scenarios }}
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r dev/dataproc/requirements.txt


      - name: Start producer
        id: start-producer
        if: ${{ steps.init.outputs.scenarios }}
        uses: ./.github/actions/dataproc_cluster
        with:
          cluster-name: ${{ steps.init.outputs.cluster_name }}
          project-id: gcp-open-lineage-testing
          region: us-west1
          # the GCS transport: runner/create_cluster.sh's default, a fixed snapshot (released 1.40.0-1.55.0 break Hive)
          create-command: |
            producer/hive_dataproc/runner/create_cluster.sh \
              --hive-release "${{ inputs.component_release }}" \
              --cluster-name "${{ steps.init.outputs.cluster_name }}" \
              --hive-jar "${{ steps.upload-hive-integration.outputs.uploaded-file }}" \
              --credentials-file "${{ steps.gcp-auth.outputs.credentials_file_path }}"

      - name: Set producer output event dir
        if: ${{ steps.init.outputs.scenarios }}
        id: set-producer-output
        run: | 
          echo "event_dir=/tmp/producer-$(date +%s%3N)" >> $GITHUB_OUTPUT

      - name: Run producer jobs and create OL events
        if: ${{ steps.init.outputs.scenarios }}
        id: run-producer
        run: |
          producer/hive_dataproc/runner/run_scenarios.sh \
            --cluster-name "${{ steps.init.outputs.cluster_name }}" \
            --scenarios "${{ steps.init.outputs.scenarios }}" \
            --events-dir "${{ steps.set-producer-output.outputs.event_dir }}" \
            --credentials-file "${{ steps.gcp-auth.outputs.credentials_file_path }}"

      - name: Validation
        if: ${{ steps.init.outputs.scenarios }}
        uses: ./.github/actions/run_event_validation
        with:
          component: 'hive_dataproc'
          release_tags: ${{ inputs.get-latest-snapshots == 'true' && 'main' || inputs.ol_release }}
          ol_release: ${{ inputs.ol_release }}
          component_release: ${{ inputs.component_release }}
          event-directory: ${{ steps.set-producer-output.outputs.event_dir }}
          target-path: 'hive-dataproc-${{inputs.component_release}}-${{inputs.ol_release}}-report.json'
          run-status-file: ${{ steps.set-producer-output.outputs.event_dir }}/status.json

      # the events PR checks re-validate when validation code changes (revalidate_stored_events.yml)
      - name: Update baseline events
        if: ${{ inputs.update-baseline && steps.init.outputs.scenarios }}
        run: |
          baseline="gs://open-lineage-e2e/baseline-events/hive_dataproc/${{ inputs.component_release }}/${{ inputs.ol_release }}"
          gcloud storage rsync -r --delete-unmatched-destination-objects "${{ steps.set-producer-output.outputs.event_dir }}" "$baseline"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.init.outputs.scenarios }}
        with:
          name: hive-dataproc-${{inputs.component_release}}-${{inputs.ol_release}}-report
          path: hive-dataproc-${{inputs.component_release}}-${{inputs.ol_release}}-report.json
          retention-days: 1
          if-no-files-found: error
