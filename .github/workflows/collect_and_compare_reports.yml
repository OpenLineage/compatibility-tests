name: Collect Reports
on:
  workflow_call:
    inputs:
      fail-for-new-failures:
        type: boolean
        required: false
        default: false
        description: "fail the job if new failure report is found"
      track-pending:
        type: boolean
        required: false
        default: false
        description: "update pending_runs.json from the planned-parts artifact: planned parts without a report stay pending (release check)"

jobs:
  collect-and-compare-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - uses: actions/upload-artifact@v4
        with:
          name: last-report
          path: generated-files/report.json
          retention-days: 1

      - uses: actions/checkout@v4

      - name: Create report.json directory
        run: mkdir -p reports/

      - uses: actions/download-artifact@v4
        with:
          path: reports/
          merge-multiple: true

      # before the comparison writes its own *-report.json files into reports/
      - name: Update pending parts
        if: ${{ inputs.track-pending }}
        run: |
          python scripts/pending_runs.py update \
            --planned reports/planned.json \
            --reports-dir reports/ \
            --pending generated-files/pending_runs.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out reports/updated-pending-runs.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.track-pending }}
        with:
          name: updated-pending-runs
          path: reports/updated-pending-runs.json
          retention-days: 1
          if-no-files-found: error

      - name: Run task for Collect Reports
        id: collect-and-merge-reports
        run: python scripts/compare_and_merge_reports.py --report_base_dir=./reports/

      - uses: actions/upload-artifact@v4
        with:
          name: updated-report
          path: reports/updated-report.json
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: retention-failures-report
          path: reports/retention-failures-report.json
          retention-days: 1

      - name: Fail if new failures found
        id: fail-for-new-failures
        if: ${{ inputs.fail-for-new-failures && steps.collect-and-merge-reports.outcome == 'success'}}
        run: |
          jq -e '. == []' reports/retention-failures-report.json > /dev/null ||  exit 1