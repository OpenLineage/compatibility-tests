name: Spark Dataproc

on:
  workflow_call:
    secrets:
      gcpKey:
        required: true
      postgresqlUser:
        required: true
      postgresqlPassword:
        required: true
    inputs:
      matrix:
        description: "JSON with 'component_version' (spark releases) and 'openlineage_versions' lists, each spark release gets one cluster running all openlineage versions"
        type: string
      get-latest-snapshots:
        description: "Should the artifact be downloaded from maven repo or circleci"
        type: string

env:
  RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
  GCS_BUCKET: open-lineage-e2e

jobs:
  stage-openlineage-jars:
    runs-on: ubuntu-latest
    outputs:
      openlineage_jars: ${{ steps.stage.outputs.openlineage_jars }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: GCP authorization
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # jars are kept in the shared gs://open-lineage-e2e/jars/ directory, released ones are uploaded only once
      - name: Stage OL jars in GCS
        id: stage
        run: |
          pip install requests
          snapshots=''
          [[ '${{ inputs.get-latest-snapshots }}' != 'true' ]] || snapshots='--snapshots'
          openlineage_jars=$(producer/spark_dataproc/runner/stage_openlineage_jars.sh $snapshots \
            $(echo '${{ inputs.matrix }}' | jq -r '.openlineage_versions[]'))
          echo "openlineage_jars=$openlineage_jars" >> $GITHUB_OUTPUT

  run-spark-tests:
    needs: stage-openlineage-jars
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark_release: ${{ fromJson(inputs.matrix).component_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: initialize tests
        id: init
        run: |
          component_suffix=$(echo '${{ matrix.spark_release }}' | sed 's/\.//g')
          echo "component_cluster_suffix=$component_suffix" >> $GITHUB_OUTPUT
          echo "cluster_name=dataproc-producer-test-$component_suffix-${RUN_KEY}" >> $GITHUB_OUTPUT
          case "${{ matrix.spark_release }}" in
            "3.5.1")
              echo "spark_short=3.5" >> $GITHUB_OUTPUT
              echo "dataproc_version=2.2-ubuntu22" >> $GITHUB_OUTPUT
              ;;
            "3.3.2")
              echo "spark_short=3.3" >> $GITHUB_OUTPUT
              echo "dataproc_version=2.1-ubuntu20" >> $GITHUB_OUTPUT
              ;;
            "3.1.3")
              echo "spark_short=3.1" >> $GITHUB_OUTPUT
              echo "dataproc_version=2.0-ubuntu18" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "spark version ${{ matrix.spark_release }} not supported"
              exit 1
              ;;
          esac

          # one line per openlineage version: '<ol_release> <scenarios separated by ;>'
          : > /tmp/ol_scenarios
          for ol_release in $(echo '${{ inputs.matrix }}' | jq -r '.openlineage_versions[]'); do
            scenarios=$(./scripts/get_valid_test_scenarios.sh "producer/spark_dataproc/scenarios/" ${{ matrix.spark_release }} $ol_release)
            [[ "$scenarios" == "" ]] || echo "$ol_release $scenarios" >> /tmp/ol_scenarios
          done
          cat /tmp/ol_scenarios
          [[ ! -s /tmp/ol_scenarios ]] || echo "any_scenarios=true" >> $GITHUB_OUTPUT

      - name: GCP authorization
        id: gcp-auth
        if: ${{ steps.init.outputs.any_scenarios }}
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      - name: Stage Spark BigQuery connector in GCS
        id: stage-spark-bq-connector
        if: ${{ steps.init.outputs.any_scenarios }}
        run: |
          jar="spark-${{ steps.init.outputs.spark_short }}-bigquery-0.42.0.jar"
          if ! gcloud storage ls "gs://${GCS_BUCKET}/jars/$jar" > /dev/null 2>&1; then
            curl -fsSL -o "/tmp/$jar" "https://repo1.maven.org/maven2/com/google/cloud/spark/spark-${{ steps.init.outputs.spark_short }}-bigquery/0.42.0/$jar"
            gcloud storage cp "/tmp/$jar" "gs://${GCS_BUCKET}/jars/$jar"
          fi
          echo "url=gs://${GCS_BUCKET}/jars/$jar" >> $GITHUB_OUTPUT

      # uploaded per run, so runs from other branches can't swap the scripts while the cluster starts,
      # they are removed once the cluster is created
      - name: Upload initialization actions to GCS
        id: upload-initialization-actions
        if: ${{ steps.init.outputs.any_scenarios }}
        run: |
          scripts_dir="gs://${GCS_BUCKET}/scripts/${RUN_KEY}/${{ matrix.spark_release }}"
          gcloud storage cp producer/spark_dataproc/runner/get_openlineage_jar.sh producer/spark_dataproc/runner/cloud_sql_proxy.sh "$scripts_dir/"
          echo "scripts_dir=$scripts_dir" >> $GITHUB_OUTPUT
          echo "init_actions=$scripts_dir/get_openlineage_jar.sh,$scripts_dir/cloud_sql_proxy.sh" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        if: ${{ steps.init.outputs.any_scenarios }}
        uses: actions/setup-python@v5
        with:
          cache: "pip"
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.init.outputs.any_scenarios }}
        run: |
          python -m pip install --upgrade pip
          pip install -r producer/spark_dataproc/runner/requirements.txt

      - name: Start producer
        id: start-producer
        if: ${{ steps.init.outputs.any_scenarios }}
        run: |
          metadata=''
          metadata+='SPARK_BQ_CONNECTOR_URL=${{ steps.stage-spark-bq-connector.outputs.url }}'
          metadata+=',OPENLINEAGE_JARS=${{ needs.stage-openlineage-jars.outputs.openlineage_jars }}'
          metadata+=',SPARK_SPANNER_CONNECTOR_URL=gs://spark-lib/spanner/spark-3.1-spanner-1.1.0.jar'
          metadata+=',SPARK_BIGTABLE_CONNECTOR_URL=gs://open-lineage-e2e/jars/spark-bigtable_2.12-0.5.0-SNAPSHOT.jar'
          metadata+=',enable-cloud-sql-hive-metastore=false'
          metadata+=',additional-cloud-sql-instances=gcp-open-lineage-testing:us-central1:open-lineage-e2e=tcp:3307'
          if [[ ${{ matrix.spark_release }} != "3.5.1" ]]; then
            metadata+=',SKIP_ICEBERG_AND_DELTA=true'
          fi

          python producer/spark_dataproc/runner/dataproc_workflow.py create-cluster \
          --project-id gcp-open-lineage-testing \
          --region us-west1 \
          --dataproc-image-version ${{ steps.init.outputs.dataproc_version }} \
          --cluster-name "${{ steps.init.outputs.cluster_name }}" \
          --credentials-file ${{ steps.gcp-auth.outputs.credentials_file_path }} \
          --metadata "$metadata" \
          --initialization-actions="${{ steps.upload-initialization-actions.outputs.init_actions }}"

      - name: Remove initialization actions from GCS
        if: ${{ always() && steps.upload-initialization-actions.outputs.scripts_dir }}
        run: gcloud storage rm -r "${{ steps.upload-initialization-actions.outputs.scripts_dir }}" || true

      # openlineage versions run one after another, scenarios of a single version run in parallel;
      # failed scenarios don't fail the job, they show up in validation together with their driver logs
      - name: Run producer jobs and create OL events
        if: ${{ steps.init.outputs.any_scenarios }}
        id: run-producer
        env:
          OPENLINEAGE_JARS: ${{ needs.stage-openlineage-jars.outputs.openlineage_jars }}
        run: |
          while read -r -u 3 ol_release scenarios; do
            ol_suffix=$(echo "$ol_release" | sed 's/\.//g')
            # the spark jar goes on the driver classpath, the GCS transport through --jars: since 1.54.0 it bundles
            # its own Woodstox, which breaks Hadoop's configuration parsing when it is on the system classpath
            gcs_transport_jar=$(echo "$OPENLINEAGE_JARS" | tr ';' '\n' | awk -F: -v v="$ol_release" '$1 == v { print $3 }')

            properties=''
            properties+='spark.driver.POSTGRESQL_USER=${{ secrets.postgresqlUser }}'
            properties+=',spark.driver.POSTGRESQL_PASSWORD=${{ secrets.postgresqlPassword }}'
            properties+=",spark.scenario.suffix=${{ steps.init.outputs.component_cluster_suffix }}-$ol_suffix"

            echo "Running scenarios for OpenLineage $ol_release: $scenarios"
            python producer/spark_dataproc/runner/dataproc_workflow.py run-scenarios \
            --project-id gcp-open-lineage-testing \
            --region us-west1 \
            --cluster-name "${{ steps.init.outputs.cluster_name }}" \
            --gcs-bucket "${GCS_BUCKET}" \
            --scenarios-dir producer/spark_dataproc/scenarios \
            --scenarios "$scenarios" \
            --openlineage-jars-dir "/opt/openlineage/$ol_release" \
            --jars "gs://${GCS_BUCKET}/jars/$gcs_transport_jar" \
            --events-prefix "events/${RUN_KEY}/${{ matrix.spark_release }}/$ol_release" \
            --spark-properties "$properties" \
            --max-concurrency 3 \
            --logs-directory "/tmp/driver-logs/$ol_release" \
            --credentials-file "${{ steps.gcp-auth.outputs.credentials_file_path }}" \
            || echo "::warning::Some scenarios failed for OpenLineage $ol_release"

            gcloud storage cp -r "/tmp/driver-logs/$ol_release/*" "gs://${GCS_BUCKET}/logs/${RUN_KEY}/${{ matrix.spark_release }}/$ol_release/" \
            || echo "::warning::No driver logs for OpenLineage $ol_release"
          done 3< /tmp/ol_scenarios

      - name: Terminate producer cluster
        if: ${{ always() && steps.init.outputs.any_scenarios }}
        run: |
          if gcloud dataproc clusters list --region us-west1 | grep -q "${{ steps.init.outputs.cluster_name }}"
          then
            python producer/spark_dataproc/runner/dataproc_workflow.py terminate-cluster \
            --project-id gcp-open-lineage-testing \
            --region us-west1 \
            --cluster-name "${{ steps.init.outputs.cluster_name }}" \
            --credentials-file ${{ steps.gcp-auth.outputs.credentials_file_path }}
          else
            echo "Cluster does not exist"
          fi

  validate:
    needs: run-spark-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark_release: ${{ fromJson(inputs.matrix).component_version }}
        ol_release: ${{ fromJson(inputs.matrix).openlineage_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: initialize validation
        id: init
        run: |
          scenarios=$(./scripts/get_valid_test_scenarios.sh "producer/spark_dataproc/scenarios/" ${{ matrix.spark_release }} ${{ matrix.ol_release }} )
          [[ "$scenarios" == "" ]] || echo "scenarios=$scenarios" >> $GITHUB_OUTPUT
          echo "event_dir=/tmp/producer-$(date +%s%3N)" >> $GITHUB_OUTPUT
          echo "gcs_suffix=${RUN_KEY}/${{ matrix.spark_release }}/${{ matrix.ol_release }}" >> $GITHUB_OUTPUT

      - name: GCP authorization
        if: ${{ steps.init.outputs.scenarios }}
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      # every scenario gets a directory, so a scenario without events fails validation instead of being skipped
      - name: Download events
        if: ${{ steps.init.outputs.scenarios }}
        run: |
          IFS=';' read -ra scenarios <<< "${{ steps.init.outputs.scenarios }}"
          for scenario in "${scenarios[@]}"; do
            mkdir -p "${{ steps.init.outputs.event_dir }}/$scenario"
          done
          gcloud storage cp -r "gs://${GCS_BUCKET}/events/${{ steps.init.outputs.gcs_suffix }}/*" "${{ steps.init.outputs.event_dir }}/" \
          || echo "::warning::No events found"

      - name: Validation
        if: ${{ steps.init.outputs.scenarios }}
        uses: ./.github/actions/run_event_validation
        with:
          component: 'spark_dataproc'
          release_tags: ${{ inputs.get-latest-snapshots == 'true' && 'main' || matrix.ol_release }}
          ol_release: ${{ matrix.ol_release }}
          component_release: ${{ matrix.spark_release }}
          event-directory: ${{ steps.init.outputs.event_dir }}
          target-path: 'spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report.json'

      - uses: actions/upload-artifact@v4
        if: ${{ steps.init.outputs.scenarios }}
        with:
          name: spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report
          path: spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report.json
          retention-days: 1

      - name: Get driver logs of failed scenarios
        if: ${{ steps.init.outputs.scenarios }}
        run: |
          mkdir -p failure-logs
          for scenario in $(jq -r '.[].scenarios[] | select(.status == "FAILURE") | .name' 'spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report.json'); do
            gcloud storage cp "gs://${GCS_BUCKET}/logs/${{ steps.init.outputs.gcs_suffix }}/$scenario.log" \
            "failure-logs/$scenario-${{matrix.spark_release}}-${{matrix.ol_release}}-driver.log" \
            || echo "::warning::No driver log for scenario $scenario"
          done

      - uses: actions/upload-artifact@v4
        if: ${{ steps.init.outputs.scenarios }}
        with:
          name: spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-failure-logs
          path: failure-logs/
          retention-days: 7
          if-no-files-found: ignore
