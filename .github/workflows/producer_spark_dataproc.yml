name: Spark Dataproc

on:
  workflow_call:
    secrets:
      gcpKey:
        required: true
      postgresqlUser:
        required: true
      postgresqlPassword:
        required: true
    inputs:
      matrix:
        description: "JSON with 'component_version' (spark releases) and 'openlineage_versions' lists, each spark release gets one cluster running all openlineage versions"
        type: string
      get-latest-snapshots:
        description: "Should the artifact be downloaded from maven repo or circleci"
        type: string
      update-baseline:
        description: "Store each validated pair's events as the baseline the PR checks re-validate (release check only)"
        type: boolean
        default: false

env:
  RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
  GCS_BUCKET: open-lineage-e2e

jobs:
  stage-openlineage-jars:
    runs-on: ubuntu-latest
    outputs:
      openlineage_jars: ${{ steps.stage.outputs.openlineage_jars }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: GCP authorization
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # jars are kept in the shared gs://open-lineage-e2e/jars/ directory, released ones are uploaded only once
      - name: Stage OL jars in GCS
        id: stage
        run: |
          pip install requests
          snapshots=''
          [[ '${{ inputs.get-latest-snapshots }}' != 'true' ]] || snapshots='--snapshots'
          openlineage_jars=$(producer/spark_dataproc/runner/stage_openlineage_jars.sh $snapshots \
            $(echo '${{ inputs.matrix }}' | jq -r '.openlineage_versions[]'))
          echo "openlineage_jars=$openlineage_jars" >> $GITHUB_OUTPUT

  run-spark-tests:
    needs: stage-openlineage-jars
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark_release: ${{ fromJson(inputs.matrix).component_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: initialize tests
        id: init
        run: |
          component_suffix=$(echo '${{ matrix.spark_release }}' | sed 's/\.//g')
          echo "cluster_name=dataproc-producer-test-$component_suffix-${RUN_KEY}" >> "$GITHUB_OUTPUT"
          # the cluster settings per Spark release are in producer/spark_dataproc/runner/cluster.json
          jq -e --arg v '${{ matrix.spark_release }}' '.releases | has($v)' producer/spark_dataproc/runner/cluster.json > /dev/null \
            || { echo "spark version ${{ matrix.spark_release }} not supported"; exit 1; }

          # one line per openlineage version: '<ol_release> <scenarios separated by ;>'
          : > /tmp/ol_scenarios
          for ol_release in $(echo '${{ inputs.matrix }}' | jq -r '.openlineage_versions[]'); do
            scenarios=$(./scripts/get_valid_test_scenarios.sh "producer/spark_dataproc/scenarios/" ${{ matrix.spark_release }} $ol_release)
            [[ "$scenarios" == "" ]] || echo "$ol_release $scenarios" >> /tmp/ol_scenarios
          done
          cat /tmp/ol_scenarios
          [[ ! -s /tmp/ol_scenarios ]] || echo "any_scenarios=true" >> $GITHUB_OUTPUT

      - name: GCP authorization
        id: gcp-auth
        if: ${{ steps.init.outputs.any_scenarios }}
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      - name: Set up Python 3.11
        if: ${{ steps.init.outputs.any_scenarios }}
        uses: actions/setup-python@v5
        with:
          cache: "pip"
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.init.outputs.any_scenarios }}
        run: |
          python -m pip install --upgrade pip
          pip install -r dev/dataproc/requirements.txt

      - name: Start producer
        id: start-producer
        if: ${{ steps.init.outputs.any_scenarios }}
        uses: ./.github/actions/dataproc_cluster
        with:
          cluster-name: "${{ steps.init.outputs.cluster_name }}"
          project-id: gcp-open-lineage-testing
          region: us-west1
          create-command: |
            producer/spark_dataproc/runner/create_cluster.sh \
              --spark-release "${{ matrix.spark_release }}" \
              --cluster-name "${{ steps.init.outputs.cluster_name }}" \
              --openlineage-jars "${{ needs.stage-openlineage-jars.outputs.openlineage_jars }}" \
              --credentials-file "${{ steps.gcp-auth.outputs.credentials_file_path }}"

      # openlineage versions run one after another, scenarios of a single version run in parallel
      # (their drivers all run on the master, which is why it's bigger than the workers);
      # failed scenarios don't fail the job, they show up in validation together with their driver logs
      - name: Run producer jobs and create OL events
        if: ${{ steps.init.outputs.any_scenarios }}
        id: run-producer
        env:
          OPENLINEAGE_JARS: ${{ needs.stage-openlineage-jars.outputs.openlineage_jars }}
          POSTGRESQL_USER: ${{ secrets.postgresqlUser }}
          POSTGRESQL_PASSWORD: ${{ secrets.postgresqlPassword }}
        run: |
          while read -r -u 3 ol_release scenarios; do
            producer/spark_dataproc/runner/run_scenarios.sh \
              --cluster-name "${{ steps.init.outputs.cluster_name }}" \
              --spark-release "${{ matrix.spark_release }}" \
              --ol-release "$ol_release" \
              --scenarios "$scenarios" \
              --openlineage-jars "$OPENLINEAGE_JARS" \
              --run-key "${RUN_KEY}" \
              --logs-dir "/tmp/driver-logs/$ol_release" \
              --credentials-file "${{ steps.gcp-auth.outputs.credentials_file_path }}" \
            || echo "::warning::The runner failed for OpenLineage $ol_release"
          done 3< /tmp/ol_scenarios

  # runs for every pair whose Spark jobs ran, even when the cluster of another Spark release failed;
  # a pair that didn't run produces no report, so the release check retries it (pending_runs.json)
  validate:
    needs:
      - stage-openlineage-jars
      - run-spark-tests
    if: ${{ !cancelled() && needs.stage-openlineage-jars.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spark_release: ${{ fromJson(inputs.matrix).component_version }}
        ol_release: ${{ fromJson(inputs.matrix).openlineage_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: initialize validation
        id: init
        run: |
          scenarios=$(./scripts/get_valid_test_scenarios.sh "producer/spark_dataproc/scenarios/" ${{ matrix.spark_release }} ${{ matrix.ol_release }} )
          [[ "$scenarios" == "" ]] || echo "scenarios=$scenarios" >> $GITHUB_OUTPUT
          echo "event_dir=/tmp/producer-$(date +%s%3N)" >> $GITHUB_OUTPUT

      - name: GCP authorization
        if: ${{ steps.init.outputs.scenarios }}
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.gcpKey }}'

      # status.json is written by the run step for every openlineage version it ran; without it, or when the runner
      # itself crashed for every scenario, the pair didn't run: an infra problem, not a result, so the job fails
      # without a report (the release check retries the pair, see pending_runs.json)
      # "Re-run failed jobs" reruns this job but not a run job that passed, so the pair's files can be under an earlier
      # attempt: the newest attempt that has a status.json is the pair's latest run
      - name: Check that the pair ran
        id: ran
        if: ${{ steps.init.outputs.scenarios }}
        run: |
          pair="spark ${{ matrix.spark_release }}, openlineage ${{ matrix.ol_release }}"
          status_file=/tmp/status-${{ matrix.spark_release }}-${{ matrix.ol_release }}.json
          gcs_suffix=""
          for (( attempt = ${{ github.run_attempt }}; attempt >= 1; attempt-- )); do
            suffix="${{ github.run_id }}-$attempt/${{ matrix.spark_release }}/${{ matrix.ol_release }}"
            if gcloud storage cp "gs://${GCS_BUCKET}/logs/$suffix/status.json" "$status_file" 2> /dev/null; then
              gcs_suffix="$suffix"
              break
            fi
          done
          if [[ -z "$gcs_suffix" ]]; then
            echo "::error title=Pair did not run::$pair has no status.json, its Spark jobs never ran"
            exit 1
          fi
          [[ "$attempt" == "${{ github.run_attempt }}" ]] || echo "Using the results of run attempt $attempt"
          echo "gcs_suffix=$gcs_suffix" >> "$GITHUB_OUTPUT"
          if jq -e 'all(.[]; .state == "RUNNER_FAILED")' "$status_file" > /dev/null; then
            echo "::error title=Pair did not run::$pair: the runner failed before running any scenario"
            exit 1
          fi
          echo "status_file=$status_file" >> "$GITHUB_OUTPUT"

      # every scenario gets a directory, so a scenario without events fails validation instead of being skipped
      - name: Download events
        if: ${{ steps.ran.outputs.status_file }}
        run: |
          IFS=';' read -ra scenarios <<< "${{ steps.init.outputs.scenarios }}"
          for scenario in "${scenarios[@]}"; do
            mkdir -p "${{ steps.init.outputs.event_dir }}/$scenario"
          done
          gcloud storage cp -r "gs://${GCS_BUCKET}/events/${{ steps.ran.outputs.gcs_suffix }}/*" "${{ steps.init.outputs.event_dir }}/" \
          || echo "::warning::No events found"

      - name: Validation
        if: ${{ steps.ran.outputs.status_file }}
        uses: ./.github/actions/run_event_validation
        with:
          component: 'spark_dataproc'
          release_tags: ${{ inputs.get-latest-snapshots == 'true' && 'main' || matrix.ol_release }}
          ol_release: ${{ matrix.ol_release }}
          component_release: ${{ matrix.spark_release }}
          event-directory: ${{ steps.init.outputs.event_dir }}
          target-path: 'spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report.json'
          run-status-file: ${{ steps.ran.outputs.status_file }}

      # the events PR checks re-validate when validation code changes (revalidate_stored_events.yml)
      - name: Update baseline events
        if: ${{ inputs.update-baseline && steps.ran.outputs.status_file }}
        run: |
          baseline="gs://${GCS_BUCKET}/baseline-events/spark_dataproc/${{ matrix.spark_release }}/${{ matrix.ol_release }}"
          gcloud storage rsync -r --delete-unmatched-destination-objects "${{ steps.init.outputs.event_dir }}" "$baseline"
          gcloud storage cp "${{ steps.ran.outputs.status_file }}" "$baseline/status.json"

      - uses: actions/upload-artifact@v4
        if: ${{ steps.ran.outputs.status_file }}
        with:
          name: spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report
          path: spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report.json
          retention-days: 1
          if-no-files-found: error

      # scenarios that failed validation, including those whose Dataproc job didn't finish in DONE state
      - name: Get driver logs of failed scenarios
        if: ${{ steps.ran.outputs.status_file }}
        run: |
          mkdir -p failure-logs
          failed_scenarios=$(jq -r '.[].scenarios[] | select(.status == "FAILURE") | .name' 'spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-report.json')
          for scenario in $failed_scenarios; do
            gcloud storage cp "gs://${GCS_BUCKET}/logs/${{ steps.ran.outputs.gcs_suffix }}/$scenario.log" \
            "failure-logs/$scenario-${{matrix.spark_release}}-${{matrix.ol_release}}-driver.log" \
            || echo "::warning::No driver log for scenario $scenario"
          done

      - uses: actions/upload-artifact@v4
        if: ${{ steps.ran.outputs.status_file }}
        with:
          name: spark-dataproc-${{matrix.spark_release}}-${{matrix.ol_release}}-failure-logs
          path: failure-logs/
          retention-days: 7
          if-no-files-found: ignore

