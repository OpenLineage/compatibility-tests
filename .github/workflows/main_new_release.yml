name: Release check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_dataplex:
        description: 'Run Dataplex tests'
        required: false
        default: 'true'
      run_spark_dataproc:
        description: 'Run Spark Dataproc tests'
        required: false
        default: 'true'
      run_hive_dataproc:
        description: 'Run Hive Dataproc tests'
        required: false
        default: 'true'
      run_dbt:
        description: 'Run DBT tests'
        required: false
        default: 'true'
      openlineage_release:
        description: 'Override OpenLineage release version'
        required: false
      spark_matrix:
        description: 'Overwrite matrix for spark tests'
        required: false
      hive_matrix:
        description: 'Overwrite matrix for hive tests'
        required: false
      dbt_matrix:
        description: 'Overwrite matrix for hive tests'
        required: false
      publish:
        description: "Publish the results (issues, report, site). 'false' to test pipeline changes from a branch"
        required: false
        default: 'true'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  # A separate job because the GCP key is a multi-line secret: GitHub masks each of its lines, including the bare
  # "{" and "}", and then drops every output of the job holding it that contains one, i.e. every JSON matrix
  find-dataproc-images:
    runs-on: ubuntu-latest
    outputs:
      dataproc_images: ${{ steps.find-images.outputs.dataproc_images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: GCP authorization
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Find the newest images of the Dataproc image families we test
        id: find-images
        run: ./scripts/get_dataproc_images.sh | tee -a $GITHUB_OUTPUT

  initialize_workflow:
    needs: find-dataproc-images
    runs-on: ubuntu-latest
    outputs:
      run_scenarios: ${{ steps.set-matrix-values.outputs.run_scenarios }}
      run_dataplex: ${{ github.event.inputs.run_dataplex || steps.set-matrix-values.outputs.run_dataplex }}
      run_spark_dataproc: ${{ github.event.inputs.run_spark_dataproc || steps.set-matrix-values.outputs.run_spark_dataproc }}
      run_hive_dataproc: ${{ github.event.inputs.run_hive_dataproc || steps.set-matrix-values.outputs.run_hive_dataproc }}
      run_dbt: ${{ github.event.inputs.run_dbt || steps.set-matrix-values.outputs.run_dbt }}
      any_run: ${{ steps.set-matrix-values.outputs.any_run }}
      openlineage_release: ${{ github.event.inputs.openlineage_release || steps.select-components.outputs.ol_release }}
      spark_matrix: ${{ github.event.inputs.spark_matrix || steps.set-matrix-values.outputs.spark_dataproc_matrix }}
      hive_matrix: ${{ github.event.inputs.hive_matrix || steps.set-matrix-values.outputs.hive_dataproc_matrix }}
      dbt_matrix: ${{ github.event.inputs.dbt_matrix || steps.set-matrix-values.outputs.dbt_matrix }}
      execution_time: ${{ steps.get-execution-time.outputs.execution_time }}
    steps:
      - name: Get execution time
        id: get-execution-time
        run: echo "execution_time=$(date +'%Y%d%m%H%M')" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      # finds new releases of OpenLineage, dbt and Dataproc (new images in the image families we test)
      - name: Select components to run
        id: select-components
        env:
          DATAPROC_IMAGES: ${{ needs.find-dataproc-images.outputs.dataproc_images }}
        run: ./scripts/select_components.sh

      - uses: actions/upload-artifact@v4
        if: steps.select-components.outputs.releases_updated == 'true'
        with:
          name: updated-releases
          path: generated-files/updated-releases.json
          retention-days: 1

      # scheduled runs test only what changed, manual runs test everything
      - name: set-matrix-values
        id: set-matrix-values
        env:
          LATEST_OL: ${{ github.event.inputs.openlineage_release || steps.select-components.outputs.ol_release }}
          OL_CHANGED: ${{ steps.select-components.outputs.ol_changed || 'false' }}
          LATEST_DBT: ${{ steps.select-components.outputs.dbt_release }}
          DBT_CHANGED: ${{ steps.select-components.outputs.dbt_changed || 'false' }}
          DATAPROC_CHANGED_FAMILIES: ${{ steps.select-components.outputs.dataproc_changed_families || '[]' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/get_release_matrices.sh | tee -a $GITHUB_OUTPUT

      # what this run tests, so the collect step can tell which parts produced no result (pending_runs.json)
      - name: Plan the parts of this run
        env:
          SPARK_MATRIX: ${{ github.event.inputs.spark_matrix || steps.set-matrix-values.outputs.spark_dataproc_matrix }}
          HIVE_MATRIX: ${{ github.event.inputs.hive_matrix || steps.set-matrix-values.outputs.hive_dataproc_matrix }}
          DBT_MATRIX: ${{ github.event.inputs.dbt_matrix || steps.set-matrix-values.outputs.dbt_matrix }}
          RUN_SPARK: ${{ github.event.inputs.run_spark_dataproc || steps.set-matrix-values.outputs.run_spark_dataproc }}
          RUN_HIVE: ${{ github.event.inputs.run_hive_dataproc || steps.set-matrix-values.outputs.run_hive_dataproc }}
          RUN_DBT: ${{ github.event.inputs.run_dbt || steps.set-matrix-values.outputs.run_dbt }}
          RUN_SCENARIOS: ${{ steps.set-matrix-values.outputs.run_scenarios }}
          RUN_DATAPLEX: ${{ github.event.inputs.run_dataplex || steps.set-matrix-values.outputs.run_dataplex }}
        run: |
          mkdir -p generated-files/planned
          python3 scripts/pending_runs.py plan \
            --spark-dataproc-matrix "$([[ "$RUN_SPARK" == "true" ]] && echo "$SPARK_MATRIX")" \
            --hive-dataproc-matrix "$([[ "$RUN_HIVE" == "true" ]] && echo "$HIVE_MATRIX")" \
            --dbt-matrix "$([[ "$RUN_DBT" == "true" ]] && echo "$DBT_MATRIX")" \
            --run-scenarios "$RUN_SCENARIOS" \
            --run-dataplex "$RUN_DATAPLEX" \
            --out generated-files/planned/planned.json

      - uses: actions/upload-artifact@v4
        with:
          name: planned-parts
          path: generated-files/planned/planned.json
          retention-days: 1

  ######## COMPONENT VALIDATION ########

  scenarios:
    needs: initialize_workflow
    if: ${{ needs.initialize_workflow.outputs.run_scenarios == 'true' }}
    uses: ./.github/workflows/check_scenarios.yml
    with:
      release: ${{ needs.initialize_workflow.outputs.openlineage_release }}
      get-latest-snapshots: 'false'
      fail-for-failures: false

  dataplex:
    needs: initialize_workflow
    if: ${{ needs.initialize_workflow.outputs.run_dataplex == 'true' }}
    uses: ./.github/workflows/consumer_dataplex.yml
    secrets:
      gcpKey: ${{ secrets.GCP_SA_KEY }}
    with:
      release: ${{ needs.initialize_workflow.outputs.openlineage_release }}

  spark-dataproc:
    needs: initialize_workflow
    if: ${{ needs.initialize_workflow.outputs.run_spark_dataproc == 'true' }}
    uses: ./.github/workflows/producer_spark_dataproc.yml
    secrets:
      gcpKey: ${{ secrets.GCP_SA_KEY }}
      postgresqlUser: ${{ secrets.POSTGRESQL_USER }}
      postgresqlPassword: ${{ secrets.POSTGRESQL_PASSWORD }}
    with:
      matrix: ${{ needs.initialize_workflow.outputs.spark_matrix }}
      get-latest-snapshots: 'false'
      update-baseline: true

  hive-dataproc:
    needs: initialize_workflow
    if: ${{ needs.initialize_workflow.outputs.run_hive_dataproc == 'true' }}
    uses: ./.github/workflows/producer_hive_dataproc.yml
    strategy:
      matrix: ${{ fromJson(needs.initialize_workflow.outputs.hive_matrix) }}
    secrets:
      gcpKey: ${{ secrets.GCP_SA_KEY }}
    with:
      ol_release: ${{ matrix.openlineage_versions }}
      component_release: ${{ matrix.component_version }}
      get-latest-snapshots: 'false'
      update-baseline: true

  dbt:
    needs: initialize_workflow
    if: ${{ needs.initialize_workflow.outputs.run_dbt == 'true' }}
    uses: ./.github/workflows/producer_dbt.yml
    strategy:
      matrix: ${{ fromJson(needs.initialize_workflow.outputs.dbt_matrix) }}
    with:
      ol_release: ${{ matrix.openlineage_versions }}
      dbt_release: ${{ matrix.component_version }}
      get-latest-snapshots: 'false'

  ######## COLLECTION OF REPORTS AND EXECUTE APPROPRIATE ACTIONS ########

  collect-and-compare-reports:
    needs:
      - initialize_workflow
      - scenarios
      - dataplex
      - spark-dataproc
      - hive-dataproc
      - dbt
    # a failed component doesn't stop the others from being published; it stays pending and is retried
    if: ${{ !cancelled() && needs.initialize_workflow.result == 'success' && needs.initialize_workflow.outputs.any_run == 'true' }}
    uses: ./.github/workflows/collect_and_compare_reports.yml
    with:
      track-pending: true

  notify-maintainers:
    needs:
      - initialize_workflow
      - collect-and-compare-reports
    if: ${{ !cancelled() && needs.collect-and-compare-reports.result == 'success' && github.event.inputs.publish != 'false' }}
    uses: ./.github/workflows/notify_maintainers.yml
    with:
      workflow-type: 'release'
      trigger-type: ${{ github.event.inputs.openlineage_release && 'manual' || 'scheduled' }}
      execution-time: ${{ needs.initialize_workflow.outputs.execution_time }}

  update-repo-files:
    needs:
      - initialize_workflow
      - collect-and-compare-reports
      - notify-maintainers
    # a failed notification doesn't block publishing
    if: ${{ !cancelled() && needs.collect-and-compare-reports.result == 'success' && github.event.inputs.publish != 'false' }}
    uses: ./.github/workflows/update_repo_files.yml
    secrets:
      CI_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
    with:
     workflow-type: 'release'
     trigger-type: ${{ github.event.inputs.openlineage_release && 'manual' || 'scheduled' }}
     execution-time: ${{ needs.initialize_workflow.outputs.execution_time }}

  generate-compatibility-tables:
    needs: update-repo-files
    if: ${{ !cancelled() && needs.update-repo-files.result == 'success' && needs.update-repo-files.outputs.changes_made == 'true' }}
    uses: ./.github/workflows/generate_compatibility_tables.yml

  update-site:
    needs:
      - update-repo-files
      - generate-compatibility-tables
    if: ${{ !cancelled() && needs.update-repo-files.result == 'success' && needs.generate-compatibility-tables.result == 'success' && needs.update-repo-files.outputs.changes_made == 'true' }}
    uses: ./.github/workflows/update_site.yml
    secrets:
      CI_PUSH_TOKEN: ${{ secrets.OL_SITE_PUSH_TOKEN }}
